name: Publish Lineborn Direct SIP Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/dialforge_audio/**"
      - ".github/workflows/publish-direct-sip-runtime.yml"

permissions:
  contents: write

concurrency:
  group: lineborn-direct-sip-runtime
  cancel-in-progress: false

env:
  RELEASE_TAG: "beta-v20.4.0"
  RUNTIME_VERSION: "20.4.0-beta.9"
  BARESIP_TAG: "v4.10.0"
  RE_TAG: "v4.10.0"
  SIP_ASSET: "lineborn-sip-v4.10.0.zip"

jobs:
  publish-direct-sip:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native prerequisites
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          git --version
          cmake --version
          ninja --version

      - name: Build static Windows Baresip with Lineborn audio bridge
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          git clone --depth 1 --branch %RE_TAG% https://github.com/baresip/re.git native\re
          git clone --depth 1 --branch %BARESIP_TAG% https://github.com/baresip/baresip.git native\baresip
          cmake -S native\re -B native\re\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBRE_BUILD_SHARED=OFF -DLIBRE_BUILD_STATIC=ON
          cmake --build native\re\build -j
          cmake -S native\baresip -B native\baresip\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTATIC=ON -DMODULES="account;auconv;auresamp;ctrl_tcp;g711;ice;menu;stun;turn;uuid" -DAPP_MODULES_DIR="%GITHUB_WORKSPACE%\runtime" -DAPP_MODULES="dialforge_audio"
          cmake --build native\baresip\build -j

      - name: Assemble redistributable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'package'
          $bin = Join-Path $package 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null

          $exe = Get-ChildItem native/baresip/build -Recurse -Filter baresip.exe | Select-Object -First 1
          if (-not $exe) { throw 'baresip.exe was not built' }
          Copy-Item $exe.FullName "$bin/baresip.exe" -Force

          $opensslRoots = @(
            'C:/Program Files/OpenSSL/bin',
            'C:/Program Files/OpenSSL-Win64/bin'
          ) | Where-Object { Test-Path $_ }
          foreach ($pattern in @('libssl*.dll','libcrypto*.dll')) {
            $found = @(Get-ChildItem $opensslRoots -Filter $pattern -ErrorAction SilentlyContinue | Sort-Object FullName -Unique)
            if (-not $found) { throw "OpenSSL runtime dependency missing: $pattern" }
            foreach ($file in $found) {
              Copy-Item $file.FullName (Join-Path $bin $file.Name) -Force
            }
          }

          Copy-Item native/baresip/LICENSE "$package/BARESIP-LICENSE.txt" -Force
          Copy-Item native/re/LICENSE "$package/LIBRE-LICENSE.txt" -Force
          @'
          Lineborn Direct SIP runtime
          Baresip v4.10.0 + libre v4.10.0
          Baresip/libre are redistributed under their BSD licenses.
          The required Baresip modules and Lineborn's dialforge_audio PCM bridge are statically linked into baresip.exe.
          The audio bridge exchanges PCM only over 127.0.0.1.
          '@ | Set-Content "$package/LINEBORN-SIP-RUNTIME.txt" -Encoding utf8

          Write-Host 'Packaged files:'
          Get-ChildItem $package -Recurse | Select-Object FullName,Length

      - name: Smoke test Direct SIP sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfgDir = (New-Item -ItemType Directory -Force (Join-Path $PWD 'smoke-config')).FullName
          $modulePath = (Resolve-Path 'package/bin').Path
          @"
          call_max_calls 1
          call_accept no
          audio_player dialforge,bridge
          audio_source dialforge,bridge
          ausrc_srate 16000
          auplay_srate 16000
          ausrc_channels 1
          auplay_channels 1
          ausrc_format s16
          auplay_format s16
          auenc_format s16
          audec_format s16
          module_path $modulePath
          module g711.dll
          module auconv.dll
          module auresamp.dll
          module dialforge_audio.dll
          module stun.dll
          module turn.dll
          module ice.dll
          module_app account.dll
          module_app menu.dll
          module_app ctrl_tcp.dll
          ctrl_tcp_listen 127.0.0.1:4444
          dialforge_audio_host 127.0.0.1
          dialforge_audio_rx_port 47500
          dialforge_audio_tx_port 47501
          dialforge_audio_srate 16000
          dialforge_audio_ptime 20
          "@ | Set-Content (Join-Path $cfgDir 'config') -Encoding ascii
          '' | Set-Content (Join-Path $cfgDir 'accounts') -Encoding ascii

          $env:PATH = "$(Resolve-Path 'package/bin');$env:PATH"
          $psi = [Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path 'package/bin/baresip.exe').Path
          $psi.WorkingDirectory = (Resolve-Path 'package/bin').Path
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.ArgumentList.Add('-f')
          $psi.ArgumentList.Add($cfgDir)
          $psi.ArgumentList.Add('-c')
          $proc = [Diagnostics.Process]::new()
          $proc.StartInfo = $psi
          if (-not $proc.Start()) { throw 'Could not start Baresip smoke test' }
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              if ($proc.HasExited) { break }
              try {
                $tcp = [Net.Sockets.TcpClient]::new()
                $tcp.Connect('127.0.0.1',4444)
                $tcp.Close()
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) {
              if (-not $proc.HasExited) { $proc.Kill() }
              $stdout = $proc.StandardOutput.ReadToEnd()
              $stderr = $proc.StandardError.ReadToEnd()
              Write-Host $stdout
              Write-Host $stderr
              throw 'Baresip Direct SIP control socket did not become ready'
            }
            Write-Host 'Lineborn Direct SIP sidecar smoke test passed.'
          } finally {
            if (-not $proc.HasExited) { $proc.Kill() }
            $proc.WaitForExit(5000) | Out-Null
          }

      - name: Publish Direct SIP package and manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path package/* -DestinationPath $env:SIP_ASSET -CompressionLevel Optimal -Force
          $sha = (Get-FileHash $env:SIP_ASSET -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $env:SIP_ASSET).Length

          New-Item -ItemType Directory -Force work | Out-Null
          gh release download $env:RELEASE_TAG --pattern manifest.json --dir work --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download current runtime manifest' }

          $env:SIP_SHA = $sha
          $env:SIP_SIZE = [string]$size
          @'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('work/manifest.json')
          doc = json.loads(p.read_text(encoding='utf-8-sig'))
          packages = [x for x in doc.get('packages', []) if x.get('name') != 'sip']
          asset = os.environ['SIP_ASSET']
          packages.append({
              'name': 'sip',
              'file': asset,
              'url': f"https://github.com/SumamaAhmed69/Axemetric-Caller-Beta-Runtime/releases/download/{os.environ['RELEASE_TAG']}/{asset}",
              'sha256': os.environ['SIP_SHA'],
              'size': int(os.environ['SIP_SIZE']),
              'profiles': ['compatibility','balanced','performance'],
              'engine': 'baresip-static',
              'version': '4.10.0',
          })
          doc['version'] = os.environ['RUNTIME_VERSION']
          doc['generated_at'] = datetime.now(timezone.utc).isoformat()
          doc['packages'] = packages
          Path('work/manifest-lineborn.json').write_text(json.dumps(doc, indent=2), encoding='utf-8')
          '@ | python -

          gh release upload $env:RELEASE_TAG $env:SIP_ASSET --clobber
          gh release upload $env:RELEASE_TAG work/manifest-lineborn.json#manifest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Lineborn Direct SIP runtime' }

      - name: Verify published runtime
        shell: pwsh
        run: |
          $url = "https://github.com/SumamaAhmed69/Axemetric-Caller-Beta-Runtime/releases/download/$env:RELEASE_TAG/manifest.json"
          curl.exe -L --fail --retry 5 -o published-manifest.json $url
          $doc = Get-Content published-manifest.json -Raw | ConvertFrom-Json
          if ($doc.version -ne $env:RUNTIME_VERSION) { throw "Wrong runtime version: $($doc.version)" }
          $sip = @($doc.packages | Where-Object { $_.name -eq 'sip' })
          if ($sip.Count -ne 1) { throw "Expected exactly one SIP package, found $($sip.Count)" }
          foreach ($profile in @('compatibility','balanced','performance')) {
            if ($sip[0].profiles -notcontains $profile) { throw "SIP package missing profile $profile" }
          }
          if ($sip[0].engine -ne 'baresip-static') { throw "Unexpected SIP engine: $($sip[0].engine)" }
          Write-Host 'Lineborn beta.9 Direct SIP runtime is published and verified.'
