name: Validate Dialforge Sales Acceptance

on:
  push:
    paths:
      - "benchmarks/dialforge_sales_acceptance.py"
      - "benchmarks/dialforge_sales_acceptance_v2_2.py"
      - "benchmarks/dialforge_sales_colab_bootstrap_v2.py"
      - "benchmarks/dialforge_sales_colab_bootstrap_v2_2.py"
      - "benchmarks/Dialforge_Sales_Acceptance.ipynb"
      - "benchmarks/Dialforge_Sales_Acceptance_v2.ipynb"
      - "benchmarks/Dialforge_Sales_Acceptance_v2_1.ipynb"
      - "benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb"
      - ".github/workflows/validate-sales-acceptance.yml"
  pull_request:
    paths:
      - "benchmarks/dialforge_sales_acceptance.py"
      - "benchmarks/dialforge_sales_acceptance_v2_2.py"
      - "benchmarks/dialforge_sales_colab_bootstrap_v2.py"
      - "benchmarks/dialforge_sales_colab_bootstrap_v2_2.py"
      - "benchmarks/Dialforge_Sales_Acceptance.ipynb"
      - "benchmarks/Dialforge_Sales_Acceptance_v2.ipynb"
      - "benchmarks/Dialforge_Sales_Acceptance_v2_1.ipynb"
      - "benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb"
      - ".github/workflows/validate-sales-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile sales runners and bootstraps
        run: |
          python -m py_compile benchmarks/dialforge_sales_acceptance.py
          python -m py_compile benchmarks/dialforge_sales_acceptance_v2_2.py
          python -m py_compile benchmarks/dialforge_sales_colab_bootstrap_v2.py
          python -m py_compile benchmarks/dialforge_sales_colab_bootstrap_v2_2.py

      - name: Validate Colab JSON
        run: |
          python -m json.tool benchmarks/Dialforge_Sales_Acceptance.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Sales_Acceptance_v2.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Sales_Acceptance_v2_1.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb > /dev/null

      - name: Check v2.2 resilient launcher contract
        run: |
          grep -F "ONE-CLICK DIALFORGE SALES ACCEPTANCE v2.2" benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb
          grep -F "dialforge_sales_colab_bootstrap_v2_2.py" benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb
          grep -F "v2.2-resilient" benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb
          grep -F "DIALFORGE_SOURCE_SHA" benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb
          grep -F "stderr=subprocess.STDOUT" benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb
          grep -F "DIALFORGE v2.2 FAILURE TAIL" benchmarks/Dialforge_Sales_Acceptance_v2_2.ipynb

      - name: Check v2.2 bootstrap delegation contract
        run: |
          grep -F "DIALFORGE SALES COLAB ACCEPTANCE v2.2" benchmarks/dialforge_sales_colab_bootstrap_v2_2.py
          grep -F "dialforge_final_colab_bootstrap_v3.py" benchmarks/dialforge_sales_colab_bootstrap_v2_2.py
          grep -F "dialforge_sales_acceptance_v2_2.py" benchmarks/dialforge_sales_colab_bootstrap_v2_2.py
          grep -F "base.RUNNER_PATH" benchmarks/dialforge_sales_colab_bootstrap_v2_2.py
          grep -F "base.main()" benchmarks/dialforge_sales_colab_bootstrap_v2_2.py

      - name: Check Ollama resilience contract
        run: |
          grep -F "Ollama retry" benchmarks/dialforge_sales_acceptance_v2_2.py
          grep -F "Ollama persistent failure" benchmarks/dialforge_sales_acceptance_v2_2.py
          grep -F "temperature\": 0.0 if tool_mode else 0.15" benchmarks/dialforge_sales_acceptance_v2_2.py
          grep -F "transport_error" benchmarks/dialforge_sales_acceptance_v2_2.py
          grep -F "base.chat = resilient_chat" benchmarks/dialforge_sales_acceptance_v2_2.py

      - name: Check consultative sales contract
        run: |
          grep -F "DISCOVER BEFORE PRESCRIBING" benchmarks/dialforge_sales_acceptance.py
          grep -F "QUALIFY NATURALLY" benchmarks/dialforge_sales_acceptance.py
          grep -F "VALUE BRIDGE" benchmarks/dialforge_sales_acceptance.py
          grep -F "MICRO-COMMITMENTS" benchmarks/dialforge_sales_acceptance.py
          grep -F "OBJECTION METHOD" benchmarks/dialforge_sales_acceptance.py
          grep -F "mark_do_not_call" benchmarks/dialforge_sales_acceptance.py
          grep -F "request_human_follow_up" benchmarks/dialforge_sales_acceptance.py
          grep -F "book_meeting" benchmarks/dialforge_sales_acceptance.py
          grep -F "record_outcome" benchmarks/dialforge_sales_acceptance.py
          grep -F "PHENOMENAL" benchmarks/dialforge_sales_acceptance.py
          grep -F "qwen3:4b-instruct-2507-q8_0" benchmarks/dialforge_sales_acceptance.py
