name: Verify Published Lineborn v6 Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify trained Lineborn model manifest and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: beta-v20.4.0-beta.15
          MODEL: lineborn-v6-balanced
          GGUF_SHA: 467514dd216d25b7e291345f11dba9f57d2515473434f13715d159e2db6fa398
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir . --clobber
          python - <<'PY'
          import json, os, subprocess
          doc=json.load(open('manifest.json'))
          model=os.environ['MODEL']
          gguf_sha=os.environ['GGUF_SHA']
          qwen=[p for p in doc.get('packages',[]) if p.get('name')=='qwen-model']
          assert len(qwen)==1, len(qwen)
          pkg=qwen[0]
          assert pkg.get('model')==model
          assert pkg.get('trained') is True
          assert pkg.get('quantization')=='Q4_K_M'
          assert pkg.get('source_gguf_sha256')==gguf_sha
          assert doc.get('default_profile')=='balanced'
          assert set((doc.get('qwen_models') or {}).values())=={model}
          assert pkg.get('parts')
          release=json.loads(subprocess.check_output([
              'gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['RELEASE_TAG']}"
          ], text=True))
          assets={a['name']:a for a in release['assets']}
          for part in pkg['parts']:
              asset=assets[part['file']]
              assert int(asset['size'])==int(part['size'])
              if asset.get('digest'):
                  assert asset['digest']=='sha256:'+part['sha256']
          print('Published trained Lineborn v6 Balanced runtime verified.')
          PY
