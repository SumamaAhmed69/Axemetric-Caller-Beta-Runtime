name: Validate Dialforge Benchmark

on:
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/validate-benchmark.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/validate-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile benchmark Python files
        run: |
          python -m py_compile benchmarks/dialforge_colab_benchmark.py
          python -m py_compile benchmarks/dialforge_colab_bootstrap.py
          python -m py_compile benchmarks/dialforge_final_acceptance.py
          python -m py_compile benchmarks/dialforge_final_colab_bootstrap.py
          python -m py_compile benchmarks/dialforge_final_acceptance_v2.py
          python -m py_compile benchmarks/dialforge_final_colab_bootstrap_v2.py

      - name: Validate notebook JSON
        run: |
          python -m json.tool benchmarks/Dialforge_Cloud_Benchmark.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Cloud_Benchmark_v5.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Final_Acceptance.ipynb > /dev/null

      - name: Check final v2 immutable launcher contract
        run: |
          grep -F "Dialforge Final Acceptance" benchmarks/Dialforge_Final_Acceptance.ipynb
          grep -F "dialforge_final_colab_bootstrap_v2.py" benchmarks/Dialforge_Final_Acceptance.ipynb
          grep -F "DIALFORGE_SOURCE_SHA" benchmarks/Dialforge_Final_Acceptance.ipynb
          grep -F "commits/main" benchmarks/Dialforge_Final_Acceptance.ipynb
          grep -F "dialforge-final-acceptance-results.zip" benchmarks/Dialforge_Final_Acceptance.ipynb

      - name: Check final v2 production model contract
        run: |
          grep -F 'TARGET_MODEL = "qwen3:4b-instruct"' benchmarks/dialforge_final_acceptance_v2.py
          grep -F 'PERFORMANCE_MODEL = "qwen3:4b-instruct-2507-q8_0"' benchmarks/dialforge_final_acceptance_v2.py
          grep -F '/api/chat' benchmarks/dialforge_final_acceptance_v2.py
          grep -F '"think":False' benchmarks/dialforge_final_acceptance_v2.py
          grep -F 'compute_type="int8"' benchmarks/dialforge_final_acceptance_v2.py
          grep -F 'guard_regressions' benchmarks/dialforge_final_acceptance_v2.py
          grep -F 'PHENOMENAL' benchmarks/dialforge_final_acceptance_v2.py

      - name: Check final v2 bootstrap safeguards
        run: |
          grep -F "FINAL COLAB ACCEPTANCE BOOTSTRAP v2" benchmarks/dialforge_final_colab_bootstrap_v2.py
          grep -F "qwen3:4b-instruct" benchmarks/dialforge_final_colab_bootstrap_v2.py
          grep -F "qwen3:4b-instruct-2507-q8_0" benchmarks/dialforge_final_colab_bootstrap_v2.py
          grep -F "DIALFORGE_SOURCE_SHA" benchmarks/dialforge_final_colab_bootstrap_v2.py
          grep -F "ollama-linux-amd64.tar.zst" benchmarks/dialforge_final_colab_bootstrap_v2.py

      - name: Check final v1 historical acceptance contract
        run: |
          grep -F 'TARGET_MODEL = "qwen3:4b"' benchmarks/dialforge_final_acceptance.py
          grep -F 'compute = "int8"' benchmarks/dialforge_final_acceptance.py
          grep -F 'prepare_conditionals' benchmarks/dialforge_final_acceptance.py
          grep -F 'voice_start_ms' benchmarks/dialforge_final_acceptance.py

      - name: Check v6 Python 3.11 commit-pinned launcher
        run: |
          grep -F "v6-py311-commit-pinned" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "api.github.com/repos" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "commits/main" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "contents/{BOOTSTRAP_PATH}" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "bootstrap v5-py311" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "dialforge-benchmark-py311-v5" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "DIALFORGE_SOURCE_SHA" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb
          grep -F "stderr=subprocess.STDOUT" benchmarks/Dialforge_Cloud_Benchmark_v6.ipynb

      - name: Check Python 3.11 bootstrap safeguards
        run: |
          grep -F "bootstrap v5-py311" benchmarks/dialforge_colab_bootstrap.py
          grep -F "dialforge-benchmark-py311-v5" benchmarks/dialforge_colab_bootstrap.py
          grep -F "Provisioning managed CPython 3.11" benchmarks/dialforge_colab_bootstrap.py
          grep -F "python_is_311" benchmarks/dialforge_colab_bootstrap.py
          grep -F "numpy==1.26.4" benchmarks/dialforge_colab_bootstrap.py
          grep -F -- "--pipeline-models" benchmarks/dialforge_colab_bootstrap.py
          grep -F "ollama-linux-amd64.tar.zst" benchmarks/dialforge_colab_bootstrap.py
          grep -F -- '"-C"' benchmarks/dialforge_colab_bootstrap.py

      - name: Test managed Python 3.11 environment path
        run: sudo /usr/bin/python3 benchmarks/dialforge_colab_bootstrap.py --test-py311-only --no-require-cuda

      - name: Test exact resumable Ollama bootstrap path
        run: sudo /usr/bin/python3 benchmarks/dialforge_colab_bootstrap.py --install-ollama-only --no-require-cuda
