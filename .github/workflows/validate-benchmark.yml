name: Validate Dialforge Benchmark

on:
  push:
    paths:
      - "benchmarks/**"
      - ".github/workflows/validate-benchmark.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/validate-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile benchmark Python files
        run: |
          python -m py_compile benchmarks/dialforge_colab_benchmark.py
          python -m py_compile benchmarks/dialforge_colab_bootstrap.py
      - name: Validate notebook JSON
        run: |
          python -m json.tool benchmarks/Dialforge_Cloud_Benchmark.ipynb > /dev/null
          python -m json.tool benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb > /dev/null
      - name: Check v4 launcher and resilient bootstrap
        run: |
          grep -F "v4-live-log" benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb
          grep -F "dialforge-bootstrap.log" benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb
          grep -F "subprocess.Popen" benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb
          grep -F "stderr=subprocess.STDOUT" benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb
          grep -F "dialforge_colab_bootstrap.py" benchmarks/Dialforge_Cloud_Benchmark_v4.ipynb
          grep -F -- "--pipeline-models" benchmarks/dialforge_colab_bootstrap.py
          grep -F "ollama-linux-amd64.tar.zst" benchmarks/dialforge_colab_bootstrap.py
          grep -F -- '"-C"' benchmarks/dialforge_colab_bootstrap.py
          grep -F "dialforge-benchmark-venv-v4" benchmarks/dialforge_colab_bootstrap.py
          grep -F "python3-virtualenv" benchmarks/dialforge_colab_bootstrap.py
          grep -F "virtualenv==20.35.4" benchmarks/dialforge_colab_bootstrap.py
      - name: Test virtualenv path without stdlib ensurepip
        run: sudo /usr/bin/python3 benchmarks/dialforge_colab_bootstrap.py --test-venv-only --no-require-cuda
      - name: Test exact resumable Ollama bootstrap path
        run: sudo /usr/bin/python3 benchmarks/dialforge_colab_bootstrap.py --install-ollama-only --no-require-cuda
