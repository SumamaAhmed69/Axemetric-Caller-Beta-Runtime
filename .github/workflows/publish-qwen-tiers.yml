name: Legacy stock-Qwen publisher (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-publisher-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy stock-model publication
        run: |
          echo "This workflow is intentionally disabled."
          echo "Lineborn v6 passed the trained-model release gate and no longer ships qwen3:1.7b or stock Qwen 4B tags."
          echo "Package only the validated lineborn-v6-balanced and lineborn-v6-performance GGUF artifacts."
