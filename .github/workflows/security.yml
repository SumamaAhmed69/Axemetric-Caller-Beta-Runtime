name: Lineborn security checks

on:
  push:
    branches:
      - main
      - lineborn-v6-release
      - lineborn-v6-deployment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check bandit pip-audit
      - name: Static Python security scan
        run: |
          bandit -q -ll \
            benchmarks/dialforge_release_safety_v4.py \
            benchmarks/dialforge_spoken_safety.py \
            benchmarks/dialforge_final_release_acceptance_v4.py \
            benchmarks/lineborn_release_acceptance_v5.py \
            benchmarks/lineborn_trained_release_acceptance_v6.py \
            benchmarks/lineborn_v6_kaggle_benchmark.py \
            training/*.py
      - name: Dependency vulnerability audit
        run: pip-audit -r training/requirements-colab.txt --progress-spinner off
      - name: Reject obvious committed credentials
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          patterns = [
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{40,}'),
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          ]
          hits = []
          for root in (pathlib.Path('benchmarks'), pathlib.Path('training'), pathlib.Path('runtime')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() in {'.png','.jpg','.jpeg','.zip','.bin','.gguf'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for pattern in patterns:
                      if pattern.search(text):
                          hits.append(str(path))
                          break
          if hits:
              print("Potential committed credentials:", *hits, sep="\n- ")
              raise SystemExit(1)
          print("No obvious committed credentials found.")
          PY
