name: Publish Hardened Chatterbox Runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/chatterbox_bridge.py"
      - ".github/workflows/publish-chatterbox-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta15-runtime-manifest-publish
  cancel-in-progress: false

env:
  RELEASE_TAG: beta-v20.4.0-beta.15
  CHATTERBOX_SOURCE: git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2
  PERTH_SOURCE: git+https://github.com/resemble-ai/Perth.git@ff1c8ac55a976971245cdd53c18d6131ca00d993

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build portable Chatterbox runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller fastapi uvicorn pydantic huggingface_hub requests packaging filelock regex tqdm safetensors importlib_metadata
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
          pip install --force-reinstall --no-deps $env:PERTH_SOURCE
          pip install --force-reinstall --no-deps $env:CHATTERBOX_SOURCE
          @'
          import inspect
          import importlib.metadata as md
          import perth
          from chatterbox.tts_turbo import ChatterboxTurboTTS
          sig = inspect.signature(ChatterboxTurboTTS.from_pretrained)
          if 'nano' not in sig.parameters:
              raise SystemExit('Pinned Chatterbox source does not expose Nano support')
          if perth.PerthImplicitWatermarker is None:
              raise SystemExit('Perth watermark support unavailable')
          for package in ('requests', 'packaging', 'filelock', 'regex', 'tqdm', 'safetensors', 'huggingface-hub', 'diffusers', 'transformers'):
              print(package, md.version(package))
          print('Chatterbox Nano, Perth watermark support and dependency metadata verified.')
          '@ | python -
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name chatterbox-server --distpath dist --workpath work --specpath spec --collect-all chatterbox --collect-all perth --collect-all torch --collect-all torchaudio --recursive-copy-metadata diffusers --recursive-copy-metadata transformers --copy-metadata requests --copy-metadata packaging --copy-metadata filelock --copy-metadata regex --copy-metadata tqdm --copy-metadata safetensors --copy-metadata huggingface-hub --copy-metadata importlib_metadata runtime/chatterbox_bridge.py
          if (-not (Test-Path 'dist/chatterbox-server/chatterbox-server.exe')) { throw 'Chatterbox executable missing' }

      - name: Smoke test packaged Chatterbox server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'lineborn-chatterbox-smoke'
          New-Item -ItemType Directory -Force $smokeRoot | Out-Null
          $env:AXEMETRIC_DATA_ROOT = $smokeRoot
          $env:AXEMETRIC_CHATTERBOX_PORT = '18881'
          $stdout = Join-Path $smokeRoot 'stdout.log'
          $stderr = Join-Path $smokeRoot 'stderr.log'
          $exe = (Resolve-Path 'dist/chatterbox-server/chatterbox-server.exe').Path
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          try {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
                $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
                throw "Packaged Chatterbox exited before health became ready. Exit=$($proc.ExitCode)`nSTDOUT:`n$out`nSTDERR:`n$err"
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18881/health' -TimeoutSec 3
                if ($health.ok -eq $true) {
                  $ready = $true
                  Write-Host "Packaged Chatterbox health passed: device=$($health.device), nano=$($health.nano)"
                  break
                }
              } catch {
                # Keep waiting while Python imports the packaged ML stack.
              }
            }
            if (-not $ready) {
              $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
              $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
              throw "Packaged Chatterbox did not become healthy within 120 seconds.`nSTDOUT:`n$out`nSTDERR:`n$err"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package runtime and patch manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-assets, manifest-work | Out-Null
          Compress-Archive -Path 'dist/chatterbox-server/*' -DestinationPath 'manifest-work/chatterbox.zip' -CompressionLevel Optimal -Force
          Move-Item 'manifest-work/chatterbox.zip' 'release-assets/chatterbox.zip.part001' -Force
          gh release download $env:RELEASE_TAG --pattern manifest.json --dir manifest-work --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download live runtime manifest' }
          $asset = Get-Item 'release-assets/chatterbox.zip.part001'
          $digest = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = $asset.Length
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/chatterbox.zip.part001"
          @"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('manifest-work/manifest.json')
          doc = json.loads(p.read_text(encoding='utf-8-sig'))
          all_packages = list(doc.get('packages', []))
          windows = [
              x for x in all_packages
              if x.get('name') == 'chatterbox'
              and 'windows' in (x.get('platforms') or ['windows'])
              and 'x64' in (x.get('arches') or ['x64'])
          ]
          if len(windows) != 1:
              raise SystemExit(f'Expected one Windows x64 chatterbox package, found {len(windows)}')
          pkg = windows[0]
          pkg.pop('file', None)
          pkg.pop('url', None)
          pkg['platforms'] = ['windows']
          pkg['arches'] = ['x64']
          pkg['sha256'] = '$digest'
          pkg['size'] = $size
          pkg['parts'] = [{
              'file': 'chatterbox.zip.part001',
              'url': '$url',
              'sha256': '$digest',
              'size': $size,
          }]
          qwen = [x for x in all_packages if x.get('name') == 'qwen-model']
          if len(qwen) != 1 or qwen[0].get('model') != 'lineborn-v6-balanced':
              raise SystemExit('Refusing to publish: beta.15 manifest no longer selects the trained Lineborn v6 model')
          doc['generated_at'] = datetime.now(timezone.utc).isoformat()
          Path('release-assets/manifest.json').write_text(json.dumps(doc, indent=2), encoding='utf-8')
          print('Patched only the Windows x64 chatterbox package while preserving macOS and trained Qwen entries')
          "@ | python -

      - name: Publish and verify runtime assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload $env:RELEASE_TAG release-assets/chatterbox.zip.part001 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Chatterbox upload failed' }
          gh release upload $env:RELEASE_TAG release-assets/manifest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Manifest upload failed' }

          $release = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          $manifest = Get-Content release-assets/manifest.json -Raw | ConvertFrom-Json
          $pkg = @($manifest.packages | Where-Object {
            $_.name -eq 'chatterbox' -and
            ($_.platforms -contains 'windows') -and
            ($_.arches -contains 'x64')
          })[0]
          $published = @($release.assets | Where-Object { $_.name -eq 'chatterbox.zip.part001' })[0]
          if (-not $published) { throw 'Published chatterbox asset is missing' }
          if (-not $pkg) { throw 'Published manifest is missing the Windows x64 chatterbox package' }
          if ([int64]$published.size -ne [int64]$pkg.parts[0].size) { throw 'Published chatterbox size mismatch' }
          if ($published.digest -and $published.digest -ne "sha256:$($pkg.parts[0].sha256)") { throw 'Published chatterbox digest mismatch' }
          $qwen = @($manifest.packages | Where-Object { $_.name -eq 'qwen-model' })
          if ($qwen.Count -ne 1 -or $qwen[0].model -ne 'lineborn-v6-balanced') {
            throw 'Trained Lineborn v6 manifest entry was damaged'
          }
          Write-Host 'Hardened beta.15 Chatterbox runtime published and manifest verified.'
