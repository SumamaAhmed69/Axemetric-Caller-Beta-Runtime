name: Publish Lineborn macOS Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/chatterbox_bridge.py'
      - '.github/workflows/publish-macos-runtime.yml'

permissions:
  contents: write

concurrency:
  group: beta15-runtime-manifest-publish
  cancel-in-progress: false

env:
  RELEASE_TAG: beta-v20.4.0-beta.15
  RUNTIME_VERSION: 20.4.0-beta.15
  CHATTERBOX_SOURCE: git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2
  PERTH_SOURCE: git+https://github.com/resemble-ai/Perth.git@ff1c8ac55a976971245cdd53c18d6131ca00d993

jobs:
  ollama-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Package official Ollama macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o Ollama-darwin.zip https://ollama.com/download/Ollama-darwin.zip
          unzip -q Ollama-darwin.zip -d ollama-download
          mkdir -p package
          cp -a 'ollama-download/Ollama.app/Contents/Resources/.' package/
          test -x package/ollama || chmod +x package/ollama
          file package/ollama
          export OLLAMA_HOST=127.0.0.1:11439
          export OLLAMA_MODELS="$RUNNER_TEMP/lineborn-ollama-smoke-models"
          ./package/ollama serve >ollama-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11439/api/tags >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then cat ollama-smoke.log; exit 1; fi
            sleep 1
          done
          test "$ready" = 1 || { cat ollama-smoke.log; exit 1; }
          kill "$pid" >/dev/null 2>&1 || true
          wait "$pid" 2>/dev/null || true
          (cd package && zip -qry ../ollama-macos-universal.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-macos-universal
          path: ollama-macos-universal.zip
          compression-level: 0

  chatterbox-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            torch_version: '2.6.0'
          - arch: x64
            runner: macos-15-intel
            torch_version: '2.2.2'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable Chatterbox for macOS ${{ matrix.arch }}
        shell: bash
        env:
          TORCH_VERSION: ${{ matrix.torch_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller fastapi uvicorn pydantic huggingface_hub requests packaging filelock regex tqdm safetensors importlib_metadata
          pip install "torch==$TORCH_VERSION" "torchaudio==$TORCH_VERSION"
          pip install --only-binary=:all: "numpy==1.26.4" "llvmlite==0.44.0" "numba==0.61.2"
          pip install numpy==1.26.4 librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 conformer==0.3.2 safetensors==0.5.3 spacy-pkuseg pykakasi==2.3.0 pyloudnorm omegaconf
          pip install --force-reinstall --no-deps "$PERTH_SOURCE"
          pip install --force-reinstall --no-deps "$CHATTERBOX_SOURCE"
          python - <<'PY'
          import platform, torch
          from chatterbox.tts_turbo import ChatterboxTurboTTS
          print('machine=', platform.machine(), 'torch=', torch.__version__, 'mps=', hasattr(torch.backends, 'mps') and torch.backends.mps.is_available())
          assert ChatterboxTurboTTS is not None
          PY
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name chatterbox-server --distpath dist --workpath work --specpath spec --collect-all chatterbox --collect-all perth --collect-all torch --collect-all torchaudio --recursive-copy-metadata diffusers --recursive-copy-metadata transformers --copy-metadata requests --copy-metadata packaging --copy-metadata filelock --copy-metadata regex --copy-metadata tqdm --copy-metadata safetensors --copy-metadata huggingface-hub --copy-metadata importlib_metadata runtime/chatterbox_bridge.py
          test -x dist/chatterbox-server/chatterbox-server || chmod +x dist/chatterbox-server/chatterbox-server
      - name: Smoke test packaged Chatterbox
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/lineborn-chatterbox-smoke"
          mkdir -p "$smoke"
          export AXEMETRIC_DATA_ROOT="$smoke"
          export AXEMETRIC_CHATTERBOX_PORT=18881
          export AXEMETRIC_CHATTERBOX_DEVICE=cpu
          dist/chatterbox-server/chatterbox-server >"$smoke/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18881/health | grep -q '"ok":true'; then ready=1; break; fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then cat "$smoke/server.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = 1 || { cat "$smoke/server.log"; exit 1; }
          kill "$pid" >/dev/null 2>&1 || true
          wait "$pid" 2>/dev/null || true
          (cd dist/chatterbox-server && zip -qry "../../chatterbox-macos-${{ matrix.arch }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-macos-${{ matrix.arch }}
          path: chatterbox-macos-${{ matrix.arch }}.zip
          compression-level: 0

  publish:
    needs: [ollama-macos, chatterbox-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build multi-platform manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work release-assets
          gh release download "$RELEASE_TAG" --pattern manifest.json --dir work --clobber
          cp artifacts/*.zip release-assets/
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          target_tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          doc = json.loads(Path('work/manifest.json').read_text(encoding='utf-8-sig'))

          # Patch the live beta.15 manifest in place. Preserve the validated
          # Windows, Qwen and speech packages, replace only macOS binaries, and
          # remove the retired standalone SIP runtime now that PJSIP is embedded.
          packages = []
          for pkg in doc.get('packages', []):
              p = dict(pkg)
              name = p.get('name')
              platforms = p.get('platforms') or ['windows']
              if name == 'sip':
                  continue
              if name in {'ollama', 'chatterbox'} and 'macos' in platforms:
                  continue
              packages.append(p)

          def package_from_file(name, filename, arches, **extra):
              path = Path('release-assets') / filename
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              return {
                  'name': name,
                  'file': filename,
                  'url': f'https://github.com/{repo}/releases/download/{target_tag}/{filename}',
                  'sha256': sha,
                  'size': len(data),
                  'profiles': ['compatibility', 'balanced', 'performance'],
                  'platforms': ['macos'],
                  'arches': arches,
                  **extra,
              }

          packages.append(package_from_file('ollama', 'ollama-macos-universal.zip', ['x64','arm64'], engine='ollama-macos'))
          packages.append(package_from_file('chatterbox', 'chatterbox-macos-arm64.zip', ['arm64'], engine='chatterbox-nano-mps'))
          packages.append(package_from_file('chatterbox', 'chatterbox-macos-x64.zip', ['x64'], engine='chatterbox-nano-cpu'))

          doc['version'] = os.environ['RUNTIME_VERSION']
          doc['generated_at'] = datetime.now(timezone.utc).isoformat()
          doc['platform_contract'] = 1
          doc['packages'] = packages
          Path('release-assets/manifest.json').write_text(json.dumps(doc, indent=2), encoding='utf-8')

          required = {'ollama','qwen-model','chatterbox','speech-cache'}
          for platform_name, arches in {'windows':['x64'], 'macos':['x64','arm64']}.items():
              for arch in arches:
                  for profile in ['compatibility','balanced','performance']:
                      selected = [
                          p for p in packages
                          if profile in p.get('profiles', [])
                          and platform_name in (p.get('platforms') or ['windows'])
                          and arch in (p.get('arches') or ['x64'])
                      ]
                      names = {p['name'] for p in selected}
                      missing = required - names
                      if missing:
                          raise SystemExit(f'{platform_name}/{arch}/{profile} missing {sorted(missing)}')
                      for singleton in required:
                          count = sum(1 for p in selected if p['name'] == singleton)
                          if count != 1:
                              raise SystemExit(f'{platform_name}/{arch}/{profile}: expected one {singleton}, got {count}')
                      qwen = [p for p in selected if p['name'] == 'qwen-model']
                      if qwen[0].get('model') != 'lineborn-v6-balanced':
                          raise SystemExit(f'{platform_name}/{arch}/{profile}: unexpected Qwen model {qwen[0].get("model")}')
          print('Idempotent beta.15 multi-platform runtime manifest validated.')
          PY
      - name: Publish beta.15 runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title 'AxeCAll Runtime 20.4.0 beta.15' --notes 'Multi-platform runtime feed for Windows and macOS with embedded PJSIP in the application and verified local AI packages.'
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/manifest.json --clobber
          curl -fL --retry 5 -o published-manifest.json "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json"
          python - <<'PY'
          import json, os
          doc=json.load(open('published-manifest.json'))
          assert doc['version'] == os.environ['RUNTIME_VERSION']
          assert doc.get('platform_contract') == 1
          print('Published macOS/Windows runtime manifest verified with', len(doc['packages']), 'package entries.')
          PY
