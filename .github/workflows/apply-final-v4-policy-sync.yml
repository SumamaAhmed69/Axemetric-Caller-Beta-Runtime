name: Apply final v4 production-policy sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-final-v4-policy-sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch final release runner
        run: |
          python scripts/apply_final_v4_sync.py
          git diff --check
          git diff -- benchmarks/dialforge_final_release_acceptance_v4.py

      - name: Commit production policy sync
        run: |
          if git diff --quiet -- benchmarks/dialforge_final_release_acceptance_v4.py; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/dialforge_final_release_acceptance_v4.py
          git commit -m "Use frozen production policy in final v4 gate"
          git push origin HEAD:main
