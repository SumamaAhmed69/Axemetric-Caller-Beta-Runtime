name: Apply macOS runtime bridge support

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_macos_runtime_support.py'
      - '.github/workflows/apply-macos-runtime-support.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_macos_runtime_support.py
      - name: Commit bridge changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/chatterbox_bridge.py
          git commit -m 'Add macOS Chatterbox device and data-path support'
          git push origin HEAD:main
