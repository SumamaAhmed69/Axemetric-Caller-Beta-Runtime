name: Validate Lineborn Colab runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'colab/lineborn_colab_runtime.py'
      - 'colab/lineborn_colab_bootstrap.py'
      - 'colab/Lineborn_PreRelease_Runtime.ipynb'
      - 'benchmarks/lineborn_strict_colab_bootstrap.py'
      - 'benchmarks/Lineborn_Strict_PreRelease_Colab.ipynb'
      - '.github/workflows/validate-lineborn-colab-runtime.yml'

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile runtime sources
        run: |
          set -euo pipefail
          python -m py_compile \
            colab/lineborn_colab_runtime.py \
            colab/lineborn_colab_bootstrap.py \
            benchmarks/lineborn_strict_colab_bootstrap.py
      - name: Validate notebooks and runtime contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          runtime_nb = json.loads(Path('colab/Lineborn_PreRelease_Runtime.ipynb').read_text('utf-8'))
          direct_nb = json.loads(Path('benchmarks/Lineborn_Strict_PreRelease_Colab.ipynb').read_text('utf-8'))
          assert runtime_nb.get('nbformat') == 4
          assert direct_nb.get('nbformat') == 4

          runtime_source = '\n'.join(''.join(c.get('source') or []) for c in runtime_nb.get('cells') or [])
          direct_source = '\n'.join(''.join(c.get('source') or []) for c in direct_nb.get('cells') or [])
          runtime = Path('colab/lineborn_colab_runtime.py').read_text('utf-8')
          bootstrap = Path('colab/lineborn_colab_bootstrap.py').read_text('utf-8')
          direct_bootstrap = Path('benchmarks/lineborn_strict_colab_bootstrap.py').read_text('utf-8')

          for token in [
              'LINEBORN COLAB RUNTIME READY',
              '/lineborn/benchmark',
              'lineborn-prerelease-benchmark.json',
              'STRICT PRE-RELEASE RESULT',
          ]:
              assert token in runtime_source, token

          for token in [
              '@app.get("/lineborn/health")',
              '@app.post("/lineborn/voice-reference")',
              '@app.post("/lineborn/warmup")',
              '@app.post("/lineborn/benchmark")',
              '@app.get("/lineborn/benchmark/latest")',
              'MAX_TRANSCRIPTION_BYTES = 16 * 1024 * 1024',
              'secrets.compare_digest',
              '"errors_max": 0',
              '"llm_ttft_median_max_ms": 1200.0',
              '"voice_start_p95_max_ms": 4500.0',
              '"stt_wer_median_max": 0.18',
              '"tts_rtf_median_max": 0.70',
          ]:
              assert token in runtime, token

          assert 'LINEBORN_COMPANION_TOKEN' in bootstrap
          assert 'lineborn_colab_runtime:app' in bootstrap
          assert 'trycloudflare.com' in bootstrap
          assert 'vram_mb >= 20_000' in bootstrap
          assert 'vram_mb >= 11_500' in bootstrap

          # Direct benchmark must not require desktop pairing or a tunnel.
          for token in [
              'Lineborn — Strict Pre-Release Benchmark (Direct Colab)',
              'lineborn_strict_colab_bootstrap.py',
              'lineborn-strict-prerelease.json',
              'LINEBORN STRICT PRE-RELEASE',
          ]:
              assert token in direct_source, token
          assert 'dialforge_final_release_acceptance_v4_kaggle.py' in direct_bootstrap
          assert 'direct-colab-no-desktop' in direct_bootstrap
          assert 'qwen3:1.7b' in direct_bootstrap
          assert 'qwen3:4b-instruct' in direct_bootstrap
          assert 'qwen3:4b-instruct-2507-q8_0' in direct_bootstrap
          assert 'trycloudflare.com' not in direct_bootstrap
          assert 'LINEBORN_COMPANION_TOKEN' not in direct_bootstrap

          # Public benchmark/runtime must never contain application/carrier credentials.
          forbidden = ['SIP_PASSWORD=', 'LIVEKIT_API_SECRET=', 'AXEMETRIC_CONTROL_TOKEN=']
          for token in forbidden:
              for text in (runtime, bootstrap, runtime_source, direct_bootstrap, direct_source):
                  assert token not in text

          print('Lineborn Colab runtime + direct pre-release benchmark static contract: PASS')
          PY
