name: Apply macOS SIP portability fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-macos-runtime-build-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Baresip bridge for macOS threading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('runtime/dialforge_audio/dialforge_audio.c')
          text = path.read_text('utf-8')
          if '#include <threads.h>' in text:
              path.write_text(text.replace('#include <threads.h>', '#include <re_thread.h>', 1), 'utf-8')
          elif '#include <re_thread.h>' not in text:
              raise SystemExit('thread compatibility include not found')
          PY
      - name: Commit SIP portability fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lineborn CI'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/dialforge_audio/dialforge_audio.c
          git diff --cached --quiet && exit 0
          git commit -m 'Use libre thread compatibility layer on macOS'
          git push origin HEAD:main
