name: Validate Lineborn Sales LoRA

on:
  push:
    branches: [lineborn-sales-lora]
    paths:
      - 'training/**'
      - '.github/workflows/validate-sales-lora.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and validate corpus
        run: |
          python training/build_sales_corpus.py
          python training/validate_sales_corpus.py
      - name: Validate Python and notebook syntax
        run: |
          python -m py_compile training/build_sales_corpus.py training/validate_sales_corpus.py training/train_sales_lora.py training/train_sales_dpo.py training/merge_sales_adapter.py training/package_sales_adapters.py
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = [
              Path('training/Lineborn_Sales_LoRA_Colab.ipynb'),
              Path('training/Lineborn_Sales_LoRA_Colab_v6.ipynb'),
          ]
          for p in notebooks:
              nb = json.loads(p.read_text('utf-8'))
              assert nb['nbformat'] == 4, p
              source = '\n'.join(''.join(c.get('source', [])) for c in nb['cells'])
              assert 'train_sales_lora.py' in source, p
              assert 'train_sales_dpo.py' in source, p
              assert 'package_sales_adapters.py' in source, p
              assert 'adapter_model.safetensors' in source, p
              print('notebook valid:', p)
          PY
      - name: Verify exporter rejects incomplete outputs and accepts real-shaped adapters
        run: |
          rm -rf /tmp/lineborn-export-test
          mkdir -p /tmp/lineborn-export-test/lineborn-sales-sft/adapter
          if python training/package_sales_adapters.py --output-root /tmp/lineborn-export-test --archive /tmp/should-not-exist.zip; then
            echo 'Exporter incorrectly accepted an empty adapter' >&2
            exit 1
          fi
          printf '{"base_model":"test"}' > /tmp/lineborn-export-test/lineborn-sales-sft/adapter/adapter_config.json
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/lineborn-export-test/lineborn-sales-sft/adapter/adapter_model.safetensors')
          p.write_bytes(b'x' * 4096)
          PY
          printf '{"train_loss":1.0}' > /tmp/lineborn-export-test/lineborn-sales-sft/training_metrics.json
          python training/package_sales_adapters.py --output-root /tmp/lineborn-export-test --archive /tmp/lineborn-export-test.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/lineborn-export-test.zip') as z:
              names=set(z.namelist())
          assert 'lineborn-sales-sft/adapter/adapter_config.json' in names
          assert 'lineborn-sales-sft/adapter/adapter_model.safetensors' in names
          assert 'lineborn-sales-export-manifest.json' in names
          print('exporter valid')
          PY
