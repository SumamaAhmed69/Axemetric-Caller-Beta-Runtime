name: Fix Final v4 Reference Audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-final-v4-reference-audio.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove brittle external reference-audio dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('benchmarks/dialforge_final_release_acceptance_v4.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('import urllib.request\n', '')
          text = text.replace('REFERENCE_URL = "https://raw.githubusercontent.com/resemble-ai/chatterbox/main/example/reference_audio.wav"\n', '')

          old = '''    reference=work/"reference.wav"\n    if not reference.exists():urllib.request.urlretrieve(REFERENCE_URL,reference)\n    prep=time.perf_counter(); tts.prepare_conditionals(str(reference),exaggeration=0.0,norm_loudness=True); voice_prep=(time.perf_counter()-prep)*1000\n'''
          new = '''    # Use speech generated by the already-loaded Chatterbox model as the\n    # deterministic conditioning reference. This exercises the exact voice\n    # conditioning path without relying on a mutable third-party sample URL.\n    reference=prospect_paths[0]\n    prep=time.perf_counter(); tts.prepare_conditionals(str(reference),exaggeration=0.0,norm_loudness=True); voice_prep=(time.perf_counter()-prep)*1000\n'''
          if text.count(old) != 1:
              raise SystemExit(f'reference block match count: {text.count(old)}')
          text = text.replace(old, new)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- benchmarks/dialforge_final_release_acceptance_v4.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/dialforge_final_release_acceptance_v4.py
          git commit -m "Remove external reference audio from final v4 gate"
          git push origin HEAD:main
