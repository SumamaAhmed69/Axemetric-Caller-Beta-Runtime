name: Sales Hard Acceptance v3.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/dialforge_sales_hard_acceptance.py"
      - "benchmarks/dialforge_sales_hard_acceptance_v3_1.py"
      - ".github/workflows/sales-hard-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: dialforge-sales-hard-v3
  cancel-in-progress: true

jobs:
  hard-sales-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama-hard-sales.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ollama-hard-sales.log" || true
          exit 1

      - name: Run adversarial model tuner and holdout gate
        id: acceptance
        shell: bash
        run: |
          set +e
          mkdir -p hard-sales-output
          python benchmarks/dialforge_sales_hard_acceptance_v3_1.py --output-dir hard-sales-output 2>&1 | tee hard-sales-output/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish score summary
        if: always()
        shell: bash
        run: |
          if [ -f hard-sales-output/dialforge-sales-hard-v3.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('hard-sales-output/dialforge-sales-hard-v3.json')
          r=json.loads(p.read_text())
          lines=['## Dialforge Sales Hard Acceptance v3.1','',f"Marketing gate: **{'PASS' if r['marketing_ready'] else 'BLOCKED'}**",'', '| Model | Score | Sales | Tools | Integrity | Critical |', '|---|---:|---:|---:|---:|---:|']
          for model,d in r['models'].items():
              lines.append(f"| {model} | {d['score']} | {d['sales']['score']} | {d['tools']['accuracy']} | {d['sales']['integrity']} | {d['sales']['critical_failures']} |")
          Path('hard-sales-output/summary.md').write_text('\n'.join(lines), encoding='utf-8')
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
          else
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload hard sales report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dialforge-Sales-Hard-v3-1
          path: |
            hard-sales-output/dialforge-sales-hard-v3.json
            hard-sales-output/run.log
            hard-sales-output/summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce marketing gate
        if: always()
        shell: bash
        run: |
          code='${{ steps.acceptance.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "Benchmark did not return an exit code."
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "Marketing remains blocked until every shipping model scores at least 85."
            exit "$code"
          fi
          echo "All shipping models cleared the 85-point marketing threshold."
