name: Sales Hard Acceptance v3.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/dialforge_sales_hard_acceptance.py"
      - "benchmarks/dialforge_sales_hard_acceptance_v3_1.py"
      - "benchmarks/dialforge_sales_hard_acceptance_v3_2.py"
      - "benchmarks/dialforge_sales_hard_acceptance_v3_3.py"
      - "benchmarks/dialforge_sales_hard_acceptance_v3_4.py"
      - "benchmarks/dialforge_production_safety.py"
      - ".github/workflows/sales-hard-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: dialforge-sales-hard-v3
  cancel-in-progress: true

jobs:
  model-benchmark:
    name: ${{ matrix.id }} production sales gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: compatibility
            model: qwen3:1.7b
          - id: balanced
            model: qwen3:4b-instruct
          - id: performance
            model: qwen3:4b-instruct-2507-q8_0
    env:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama-hard-sales.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ollama-hard-sales.log" || true
          exit 1

      - name: Run v3.4 production-equivalent gate for ${{ matrix.model }}
        shell: bash
        run: |
          set +e
          mkdir -p hard-sales-output
          python benchmarks/dialforge_sales_hard_acceptance_v3_4.py \
            --models '${{ matrix.model }}' \
            --output-dir hard-sales-output \
            2>&1 | tee hard-sales-output/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > hard-sales-output/exit-code.txt
          exit 0

      - name: Upload ${{ matrix.id }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dialforge-Sales-Hard-v3-4-${{ matrix.id }}
          path: |
            hard-sales-output/dialforge-sales-hard-v3.json
            hard-sales-output/run.log
            hard-sales-output/exit-code.txt
          if-no-files-found: warn
          retention-days: 30

  marketing-gate:
    name: Marketing gate
    needs: model-benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Dialforge-Sales-Hard-v3-4-*
          path: combined
          merge-multiple: false

      - name: Combine reports and enforce production gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          threshold = 85.0
          min_production_tools = 90.0
          files = sorted(Path('combined').glob('*/dialforge-sales-hard-v3.json'))
          if len(files) != 3:
              raise SystemExit(f'Expected 3 model reports, found {len(files)}')

          models = {}
          for path in files:
              report = json.loads(path.read_text(encoding='utf-8'))
              models.update(report.get('models') or {})

          expected = {
              'qwen3:1.7b',
              'qwen3:4b-instruct',
              'qwen3:4b-instruct-2507-q8_0',
          }
          if set(models) != expected:
              raise SystemExit(f'Wrong model set: {sorted(models)}')

          def passes(data):
              sales = data['sales']
              tools = data['tools']
              return (
                  float(data['score']) >= threshold
                  and float(sales.get('raw_score', sales['score'])) >= threshold
                  and float(tools['accuracy']) >= min_production_tools
                  and int(sales['critical_failures']) == 0
              )

          ready = all(passes(data) for data in models.values())
          combined = {
              'version': 'sales-hard-v3.4-production',
              'threshold': threshold,
              'minimum_production_tool_accuracy': min_production_tools,
              'marketing_ready': ready,
              'models': models,
          }
          Path('combined-report.json').write_text(json.dumps(combined, indent=2), encoding='utf-8')

          lines = [
              '## Dialforge Sales Hard Acceptance v3.4',
              '',
              f"Marketing gate: **{'PASS' if ready else 'BLOCKED'}**",
              '',
              '| Model | Overall | Product sales | Raw sales | Product tools | Raw native tools | Integrity | Product critical | Raw critical | Pass |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|:---:|',
          ]
          for model in ('qwen3:1.7b','qwen3:4b-instruct','qwen3:4b-instruct-2507-q8_0'):
              data = models[model]
              sales = data['sales']
              tools = data['tools']
              lines.append(
                  f"| {model} | {data['score']} | {sales['score']} | {sales.get('raw_score', 'n/a')} | "
                  f"{tools['accuracy']} | {tools.get('raw_accuracy', 'n/a')} | {sales['integrity']} | "
                  f"{sales['critical_failures']} | {sales.get('raw_critical_failures', 'n/a')} | {'✅' if passes(data) else '❌'} |"
              )
          lines += [
              '',
              '**Pass criteria per tier:** overall >=85, raw sales >=85, production tool routing >=90, zero product critical spoken hallucinations.',
              'Raw native tool serialization is diagnostic and remains visible; it is not substituted for the deterministic control layer that ships in Dialforge.',
          ]
          Path('summary.md').write_text('\n'.join(lines), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')

          if not ready:
              raise SystemExit('Marketing remains blocked until every shipping tier clears the v3.4 production gate.')
          print('All shipping tiers cleared the v3.4 production marketing gate.')
          PY

      - name: Upload combined marketing gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dialforge-Sales-Hard-v3-4-Combined
          path: |
            combined-report.json
            summary.md
          if-no-files-found: warn
          retention-days: 30
