name: Legacy Beta Runtime Publisher Disabled

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-beta-runtime.yml"

permissions:
  contents: read

# Keep the original concurrency group for this transition. This harmless run
# cancels any older single-model publisher that may still be building and could
# otherwise delete/recreate beta-v20.4.0 after the new profile-aware publisher.
concurrency:
  group: axemetric-beta-runtime
  cancel-in-progress: true

jobs:
  legacy-publisher-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy publisher is disabled
        run: |
          echo "Legacy single-Qwen runtime publisher is disabled."
          echo "Use Publish Qwen Runtime Tiers for the profile-aware beta runtime release."
